user  nginx;
# NOT auto: "auto" counts host cores, while compose gives the container a quota of
# NGINX_CPUS (1 by default). On a many-core server auto spawns dozens of
# workers squeezed into one core, and the master starts flooding error.log with
# "sendmsg() failed (109: Too many references)" on every reload.
# Keep it around NGINX_CPUS: nginx here only serves static files and proxies.
worker_processes  2;
worker_rlimit_nofile 20480;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logs ---
    # The request body is NOT logged: private keys, tokens and AML check data
    # pass through the API. The local config has body=""; in production
    # that would leak secrets straight into the log file.
    log_format main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     'rt=$request_time urt=$upstream_response_time '
                     'uct=$upstream_connect_time uht=$upstream_header_time '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main buffer=64k flush=5s;

    # --- Performance ---
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    reset_timedout_connection on;
    server_tokens       off;

    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            30s;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # --- Compression ---
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/rss+xml font/woff font/woff2
                      image/svg+xml application/vnd.ms-fontobject;

    # TLS is not terminated: only port 80 is exposed (TLS is terminated by the
    # front proxy, see README). If TLS is ever needed, bring back ssl_protocols/ssl_ciphers here
    # and open 443 in the vhost template.

    # --- Rate limiting ---
    # A general limit for the API and a strict one for the admin login forms.
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # --- Real client IP detection ---
    # HAProxy sits in front of the stack and opens its own connection to us,
    # so $remote_addr is the proxy address, not the client. The realip module
    # replaces $remote_addr with the client address from X-Forwarded-For, but ONLY if
    # the connection came from a subnet in trusted-proxies.inc. A request from anyone
    # else with their own X-Forwarded-For header gains nothing: the address
    # stays the real one. The IP whitelist in AccessApiIpMiddleware relies on this.
    #
    # real_ip_recursive on: nginx walks the XFF chain right to left, skipping
    # trusted addresses, and takes the first untrusted one, so forging
    # the start of the chain is useless.
    include /etc/nginx/geo/trusted-proxies.inc;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # --- FastCGI ---
    fastcgi_buffers         16 16k;
    fastcgi_buffer_size     32k;
    fastcgi_temp_file_write_size 256k;
    fastcgi_hide_header     X-Powered-By;

    include /etc/nginx/conf.d/*.conf;
}
