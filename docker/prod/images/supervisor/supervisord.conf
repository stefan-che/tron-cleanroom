; Supervisor for the queue container (app-queue).
; Web (php-fpm) and the scheduler run in separate containers: a crashing
; worker does not affect HTTP request handling, and vice versa.

[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid
; The supervisord master starts as root (see entrypoint.sh), otherwise it could not
; open /dev/fd/1 for worker logs (the container pipe is owned by root,
; EACCES) and could not switch workers to www-data. The workers themselves run
; as www-data; see user in [program:worker].

[unix_http_server]
file = /tmp/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[program:worker]
command = php /var/www/app/artisan queue:work
    --sleep=3
    --tries=%(ENV_QUEUE_TRIES)s
    --timeout=%(ENV_QUEUE_TIMEOUT)s
    --max-jobs=%(ENV_QUEUE_MAX_JOBS)s
    --max-time=%(ENV_QUEUE_MAX_TIME)s
    --no-interaction
directory = /var/www/app
process_name = %(program_name)s_%(process_num)02d
numprocs = %(ENV_QUEUE_WORKERS)s
user = www-data
autostart = true
autorestart = true
startsecs = 10
; A worker must have time to finish its current job: slightly more than QUEUE_TIMEOUT.
stopwaitsecs = 600
stopasgroup = true
killasgroup = true
; Logs go only to container stdout, where docker json-file picks them up
; with rotation. Writing to storage/logs/worker.log is not allowed: that file grows without rotation.
redirect_stderr = true
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
priority = 10
