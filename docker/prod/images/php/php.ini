; Production PHP settings. Override the php:8.4-fpm defaults.
; Environment-dependent values (memory_limit, opcache.validate_timestamps)
; are appended by the entrypoint to zzz-runtime.ini: php.ini cannot expand
; environment variables by itself.

; --- Errors: nothing is sent to the browser ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; --- Security ---
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; --- Limits ---
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20
file_uploads = On

; --- Cookie defaults (Laravel sets its own, this is a fallback) ---
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; --- OPcache ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10
opcache.validate_timestamps = 0
opcache.revalidate_freq = 2
opcache.save_comments = 1

; --- Realpath cache: noticeably reduces stat calls on bind mounts ---
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; --- Misc ---
date.timezone = UTC
zend.assertions = -1
