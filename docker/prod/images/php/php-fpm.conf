[www]
user = www-data
group = www-data

; Port 9000 is reachable only inside the internal backend network, not published outside.
listen = 0.0.0.0:9000

; --- Process pool ---
; max_children is sized for memory_limit 512M and the 1G container limit:
; a Laravel worker actually uses ~60-90 MB.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; Restart a worker after N requests as a safeguard against memory leaks.
pm.max_requests = 500

; --- Monitoring and healthcheck ---
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; --- Logs ---
; access.log is off: nginx already logs the same requests. Enable only for debugging.
catch_workers_output = yes
decorate_workers_output = no

; Slow requests: 10s is a signal to investigate.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Hard limit per HTTP request. Does not affect CLI (queues, scheduler).
request_terminate_timeout = 120s

clear_env = no

; --- Restrictions for the web context only ---
; The application does not need to spawn external processes from an HTTP request; on RCE this
; is the first thing attackers reach for. proc_open is NOT disabled: Symfony
; Process (scheduler) and composer use it, and the CLI context needs it too.
; If some package breaks on the web side, remove the needed function from the list.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,pcntl_exec
php_admin_flag[allow_url_include] = off
; The web process must not read outside the code and temp directories.
php_admin_value[open_basedir] = /var/www/app:/tmp:/usr/local/lib/php:/proc/self/fd
