# Production Redis. The password is passed via the --requirepass flag from compose
# so it is not stored in the image.

# --- Network ---
# Listen on all interfaces inside the internal network; no port is published outside.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0

# --- Persistence ---
# AOF: queues and the Telegram bot state machine must not be lost on restart.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
dir /data

# RDB as an extra layer.
save 900 1
save 300 10
save 60 10000
rdbcompression yes
stop-writes-on-bgsave-error yes

# --- Memory ---
# volatile-lru: only keys with a TTL (cache) are evicted; data without a TTL
# (bot dialog states) stays in place.
maxmemory 384mb
maxmemory-policy volatile-lru

# --- Security ---
# Dangerous commands are renamed to an empty string, i.e. disabled.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

# --- Logs ---
loglevel notice
logfile ""
